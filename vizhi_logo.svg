<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="520" height="130">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap');
      .brand-title {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
        fill: #F2F0EA;
      }
      .brand-tag {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        fill: #E6E0D2;
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 500;
        font-size: 13px;
        fill: #9EA6B2;
      }
      .tamil-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 14px;
        fill: #FDE68A;
      }
    </style>

    <linearGradient id="fullBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D23" />
      <stop offset="100%" stop-color="#0B0D0F" />
    </linearGradient>

    <linearGradient id="fullIrisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="fullArcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#E6E0D2" />
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Transparent or Dark Background (works on both) -->
  <rect width="520" height="130" fill="transparent" />

  <!-- ICON EMBLEM: The "Vizhi" Vigilant Eye & Light Aperture -->
  <g transform="translate(18, 17)">
    <!-- Outer Emblem Squircle Frame -->
    <rect width="96" height="96" rx="26" fill="url(#fullBgGrad)" stroke="#2E3642" stroke-width="2" />

    <!-- Vision Light Beam projection -->
    <path d="M 48 48 L 86 34 L 86 62 Z" fill="url(#fullIrisGrad)" opacity="0.12" />

    <!-- Upper Eye Contour Arc (Guiding Path) -->
    <path d="M 18 48 C 30 25, 66 25, 78 48" fill="none" stroke="url(#fullArcGrad)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Lower Eye Contour Arc (Infrastructure Base) -->
    <path d="M 18 48 C 30 71, 66 71, 78 48" fill="none" stroke="url(#fullArcGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />

    <!-- Optical Aperture Circle (AI Computer Vision Lens) -->
    <circle cx="48" cy="48" r="15" fill="none" stroke="#E6E0D2" stroke-width="2" stroke-dasharray="3, 4" opacity="0.75" />

    <!-- Radiating Light Pulse Ring -->
    <circle cx="48" cy="48" r="10" fill="none" stroke="#FDE68A" stroke-width="1.5" opacity="0.5" />

    <!-- Core Glowing Iris (Safety Beacon & Illuminating Streetlamp) -->
    <circle cx="48" cy="48" r="9.5" fill="url(#fullIrisGrad)" filter="url(#fullGlow)" />

    <!-- Central Aperture Pupil / Location Waypoint Center -->
    <circle cx="48" cy="48" r="4" fill="#0B0D0F" />
    <circle cx="46" cy="46" r="1.5" fill="#FFFFFF" />

    <!-- Top North Guiding Star -->
    <polygon points="48,22 50,26 54,27 50,29 48,33 46,29 42,27 46,26" fill="#FDE68A" />
  </g>

  <!-- TYPOGRAPHIC WORDMARK -->
  <g transform="translate(136, 0)">
    <!-- Primary Name "VIZHI" -->
    <text x="0" y="65" class="brand-title">VIZHI</text>

    <!-- "AI" Badge Pill with Emerald Glowing Accent -->
    <g transform="translate(142, 32)">
      <rect width="44" height="28" rx="8" fill="url(#badgeGrad)" />
      <text x="22" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#0B0D0F" text-anchor="middle" letter-spacing="0.5">AI</text>
    </g>

    <!-- Tamil Script "விழி" & Region Tag -->
    <g transform="translate(200, 42)">
      <rect x="0" y="0" width="105" height="20" rx="4" fill="#1C2127" stroke="#2E3642" stroke-width="1" />
      <text x="52" y="14" class="tamil-text" text-anchor="middle">விழி &middot; கோவை</text>
    </g>

    <!-- Tagline: "Navigate Safer. Report Smarter." -->
    <text x="2" y="93" class="brand-sub">
      Navigate Safer. Report Smarter.
    </text>

    <!-- Geographic & Civic Credential -->
    <text x="2" y="112" class="brand-tag">
      COIMBATORE SAFETY &amp; CIVIC PLATFORM
    </text>
  </g>
</svg>
