<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B20" />
      <stop offset="100%" stop-color="#0B0D0F" />
    </linearGradient>

    <!-- Glowing Iris & Light Rays Gradient -->
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Outer Eye Arc Gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#E6E0D2" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.3" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Icon Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#29303A" stroke-width="1.5" />

  <!-- The "Vizhi" (Eye of Vigilance & Vision) Upper and Lower Protective Arcs -->
  <g transform="translate(0, 0)">
    <!-- Upper Eye Lid / Navigation Arc -->
    <path d="M 12 32 C 22 18, 42 18, 52 32" fill="none" stroke="url(#arcGrad)" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Lower Eye Lid / Ground Road Arc -->
    <path d="M 12 32 C 22 46, 42 46, 52 32" fill="none" stroke="url(#arcGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />

    <!-- Forward Light Beam / Vision Ray -->
    <polygon points="32,32 58,24 58,40" fill="url(#irisGrad)" opacity="0.12" />

    <!-- Outer Aperture Ring -->
    <circle cx="32" cy="32" r="10" fill="none" stroke="#E6E0D2" stroke-width="1.8" stroke-dasharray="2, 3" opacity="0.8" />

    <!-- Inner Glowing Iris (Streetlight & Navigation Core) -->
    <circle cx="32" cy="32" r="6.5" fill="url(#irisGrad)" filter="url(#glow)" />

    <!-- Pupil / Central Waypoint Point -->
    <circle cx="32" cy="32" r="2.8" fill="#0B0D0F" />
    <circle cx="30.8" cy="30.5" r="1" fill="#FFFFFF" />

    <!-- Top North Star / Safety Beacon Sparkle -->
    <circle cx="32" cy="18" r="1.5" fill="#FDE68A" />
  </g>
</svg>
